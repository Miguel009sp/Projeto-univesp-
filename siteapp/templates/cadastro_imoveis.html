<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Imóvel</title>
    <!-- Estilização manual garantida caso o Bootstrap falhe ao carregar -->
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 30px auto;
            max-width: 1200px;
            padding: 0 20px;
            background-color: #ffffff;
        }
        h2 {
            color: #0d6efd;
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
            max-width: 400px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
            color: #212529;
        }
        input[type="text"], select {
            width: 100%;
            padding: 6px 12px;
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
            color: #212529;
            background-color: #fff;
            background-clip: padding-box;
            border: 1px solid #ced4da;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="text"]:focus, select:focus {
            border-color: #86b7fe;
            outline: 0;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, .25);
        }
        .btn-container {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }
        .btn {
            display: inline-block;
            font-weight: 400;
            line-height: 1.5;
            text-align: center;
            text-decoration: none;
            vertical-align: middle;
            cursor: pointer;
            user-select: none;
            border: 1px solid transparent;
            padding: 6px 24px;
            font-size: 16px;
            border-radius: 4px;
        }
        .btn-salvar {
            color: #fff;
            background-color: #198754;
            border-color: #198754;
        }
        .btn-salvar:hover {
            background-color: #157347;
        }
        .btn-voltar {
            color: #fff;
            background-color: #6c757d;
            border-color: #6c757d;
        }
        .btn-voltar:hover {
            background-color: #5c636a;
        }
    </style>
</head>

<body>
    <h2>Cadastrar Imóvel</h2>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Tipo do imóvel</label>
            <select name="tipo_imovel">
                <option>Casa</option>
                <option>Apartamento</option>
                <option>Terreno</option>
                <option>Comercial</option>
            </select>
        </div>

        <div class="form-group">
            <label>Endereço</label>
            <input type="text" name="endereco">
        </div>

        <div class="form-group">
            <label>Valor do imóvel</label>
            <input type="text" name="valor_imovel" oninput="mascaraMoeda(this)" placeholder="R$ 0,00">
        </div>

        <div class="form-group">
            <label>Proprietário</label>
            <input type="text" placeholder="Nome ou CPF do proprietário">
        </div>

        <div class="btn-container">
            <button type="submit" class="btn btn-salvar">Salvar</button>
            <a href="{% url 'home' %}" class="btn btn-voltar">Voltar</a>
        </div>

    </form>

    <script>
    function mascaraMoeda(campo) {
        let valor = campo.value;
        valor = valor.replace(/\D/g, "");
        if (valor === "") {
            campo.value = "";
            return;
        }
        valor = (valor / 100).toFixed(2) + "";
        valor = valor.replace(".", ",");
        valor = valor.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
        campo.value = "R$ " + valor;
    }
    </script>

</body>
</html>
