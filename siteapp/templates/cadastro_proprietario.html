<!DOCTYPE html>

{% load static%}

<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Proprietário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

    <h2 class="mb-4 text-primary">Cadastrar Proprietário</h2>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Nome completo</label>
            <input type="text" class="form-control" name="nome" required>
        </div>

        <div class="mb-3">
            <label class="form-label">CPF</label>
            <!-- Adicionado limitador de tamanho, placeholder e gatilho de máscara -->
            <input type="text" class="form-control" name="cpf" oninput="mascaraCPF(this)" maxlength="14" placeholder="000.000.000-00" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Telefone</label>
            <!-- Adicionado limitador de tamanho, placeholder e gatilho de máscara -->
            <input type="text" class="form-control" name="telefone" oninput="mascaraTelefone(this)" maxlength="15" placeholder="(00) 00000-0000" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Endereço</label>
            <input type="text" class="form-control" name="endereco">
        </div>

        <button class="btn btn-success">Salvar</button>
        <a href="{% url 'home' %}" class="btn btn-secondary">Voltar</a>
    </form>

    <!-- Scripts de formatação automática em tempo real -->
    <script>
    function mascaraCPF(campo) {
        let valor = campo.value.replace(/\D/g, ""); // Remove letras e símbolos
        valor = valor.replace(/(\d{3})(\d)/, "$1.$2"); // Adiciona o primeiro ponto
        valor = valor.replace(/(\d{3})(\d)/, "$1.$2"); // Adiciona o segundo ponto
        valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2"); // Adiciona o hífen
        campo.value = valor;
    }

    function mascaraTelefone(campo) {
        let valor = campo.value.replace(/\D/g, ""); // Remove letras e símbolos
        valor = valor.replace(/^(\d{2})(\d)/g, "($1) $2"); // Adiciona os parênteses do DDD
        valor = valor.replace(/(\d{5})(\d)/, "$1-$2"); // Adiciona o hífen do celular
        campo.value = valor;
    }
    </script>

</body>
</html>
