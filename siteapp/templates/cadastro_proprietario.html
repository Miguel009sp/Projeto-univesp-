<!DOCTYPE html>
{% load static %}
<html lang="pt-br" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Proprietário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            padding-bottom: 50px;
        }
        .container-cadastro {
            max-width: 600px;
            margin: 50px auto;
        }
        .card-cadastro {
            background: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        h2 {
            color: #0d6efd;
            font-size: 28px;
            font-weight: 500;
        }
        .form-label {
            font-weight: 500;
            color: #495057;
            font-size: 15px;
        }
        .form-control {
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #ced4da;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, .25);
        }
        .btn-container {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }
        .btn-acao {
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <div class="container container-cadastro px-3">
        
        <!-- BLOCO DE ALERTAS DE FEEDBACK FLUTUANTES -->
        {% if messages %}
            <div class="container-alertas mb-4">
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show d-flex align-items-center gap-2" role="alert" style="border-radius: 8px; font-weight: 500;">
                        <span style="font-size: 18px;">
                            {% if message.tags == 'success' %}✨
                            {% elif message.tags == 'error' %}⚠️
                            {% else %}ℹ️{% endif %}
                        </span>
                        <div>{{ message }}</div>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- CARTÃO DO FORMULÁRIO -->
        <div class="card-cadastro p-4 p-md-5">
            <h2 class="mb-4">👤 Cadastrar Proprietário</h2>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Nome completo</label>
                    <input type="text" class="form-control" name="nome" placeholder="Ex: João da Silva" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">CPF</label>
                    <input type="text" class="form-control" name="cpf" oninput="mascaraCPF(this)" maxlength="14" placeholder="000.000.000-00" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Telefone</label>
                    <input type="text" class="form-control" name="telefone" oninput="mascaraTelefone(this)" maxlength="15" placeholder="(00) 00000-0000" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Endereço de Residência</label>
                    <input type="text" class="form-control" name="endereco" placeholder="Rua, número, bairro e cidade">
                </div>

                <!-- CONTAINER DE BOTÕES -->
                <div class="btn-container">
                    <button type="submit" class="btn btn-success btn-acao">Salvar Proprietário</button>
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-acao">Voltar</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts de formatação automática em tempo real -->
    <script>
    function mascaraCPF(campo) {
        let valor = campo.value.replace(/\D/g, ""); 
        valor = valor.replace(/(\d{3})(\d)/, "$1.$2"); 
        valor = valor.replace(/(\d{3})(\d)/, "$1.$2"); 
        valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2"); 
        campo.value = valor;
    }

    function mascaraTelefone(campo) {
        let valor = campo.value.replace(/\D/g, ""); 
        valor = valor.replace(/^(\d{2})(\d)/g, "($1) $2"); 
        valor = valor.replace(/(\d{5})(\d)/, "$1-$2"); 
        campo.value = valor;
    }
    </script>

    <!-- INTERATIVIDADE DO BOOTSTRAP PARA FECHAR ALERTAS -->
    <script src="https://jsdelivr.net"></script>

</body>
</html>
