<!DOCTYPE html>
{% load static%}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Comprador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

    <h2 class="mb-4 text-primary">Cadastrar Comprador</h2>

    <form method="post">
        {% csrf_token %}    
        
        <div class="mb-3">
            <label class="form-label">Nome completo</label>
            <input type="text" name="nome" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">CPF</label>
            <!-- Adicionado name="cpf", limitador de caracteres e gatilho de máscara -->
            <input type="text" name="cpf" class="form-control" oninput="mascaraCPF(this)" maxlength="14" placeholder="000.000.000-00" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Telefone</label>
            <!-- Adicionado limitador de caracteres e gatilho de máscara -->
            <input type="text" name="telefone" class="form-control" oninput="mascaraTelefone(this)" maxlength="15" placeholder="(00) 00000-0000">
        </div>

        <div class="mb-3">
            <label class="form-label">Faixa de busca (R$)</label>
            <!-- Alterado para type="text" e adicionado gatilho de máscara monetária -->
            <input type="text" name="faixa_busca" class="form-control" oninput="mascaraMoeda(this)" placeholder="R$ 0,00">
        </div>

        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{% url 'home' %}" class="btn btn-secondary">Voltar</a>
    </form>

    <!-- Scripts de formatação automática em tempo real -->
    <script>
    function mascaraCPF(campo) {
        let valor = campo.value.replace(/\D/g, ""); // Remove letras
        valor = valor.replace(/(\d{3})(\d)/, "$1.$2"); // Primeiro ponto
        valor = valor.replace(/(\d{3})(\d)/, "$1.$2"); // Segundo ponto
        valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2"); // Hífen
        campo.value = valor;
    }

    function mascaraTelefone(campo) {
        let valor = campo.value.replace(/\D/g, ""); // Remove letras
        valor = valor.replace(/^(\d{2})(\d)/g, "($1) $2"); // Parênteses do DDD
        valor = valor.replace(/(\d{5})(\d)/, "$1-$2"); // Hífen do celular
        campo.value = valor;
    }

    function mascaraMoeda(campo) {
        let valor = campo.value.replace(/\D/g, "");
        valor = (valor / 100).toFixed(2) + "";
        valor = valor.replace(".", ",");
        valor = valor.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
        campo.value = "R$ " + valor;
    }
    </script>

</body>
</html>
